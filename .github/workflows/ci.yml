# Every push and pull request: run the full self-test inside the real app on Windows, macOS and Linux.
# A tag such as v2.1.0: also build the four download zips and publish them as that GitHub release
# (release notes come from RELEASE_NOTES.md). The website (Cloudflare Pages) deploys from main by itself.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Self-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Windows is the main platform and must pass; macOS and Linux results are reported without blocking a release
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Changelog files match nexora/app/changelog.js and package.json
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/changelog.ps1 -Check
      - name: Fetch FFmpeg (Windows) and the on-device AI models
        shell: pwsh
        run: ./scripts/fetch-vendor.ps1
      - name: System FFmpeg (macOS / Linux builds use an installed FFmpeg)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; else sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          ffmpeg -version | head -n 1
      - name: Self-test (Linux, virtual display)
        if: runner.os == 'Linux'
        # screen capture needs a real desktop session, which a virtual display does not provide
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" npx --yes electron@33.2.0 . --no-sandbox --nx-selftest --nx-userdata="$RUNNER_TEMP/nexora" "--nx-skip=gaming: real window capture"
      - name: Self-test
        if: runner.os != 'Linux'
        shell: bash
        run: |
          npx --yes electron@33.2.0 . --nx-selftest --nx-userdata="$RUNNER_TEMP/nexora"

  release:
    name: Build and publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch FFmpeg and the AI models
        shell: pwsh
        run: ./scripts/fetch-vendor.ps1
      - name: Online sign-in endpoint (repository secret GAS_URL, optional)
        shell: pwsh
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: |
          if ($env:GAS_URL) { @{ url = $env:GAS_URL } | ConvertTo-Json | Set-Content electron/gas.config.json -Encoding utf8NoBOM; 'online sign-in included' } else { 'no GAS_URL secret: local accounts only' }
      - name: Version must match the tag
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version; if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "package.json says $v but the tag is $env:GITHUB_REF_NAME" }
      - name: rcedit (puts the NEXORA icon and name into the Windows .exe)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -OutFile "$env:RUNNER_TEMP/rcedit.exe"
          "rcedit sha256: " + (Get-FileHash "$env:RUNNER_TEMP/rcedit.exe" -Algorithm SHA256).Hash
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -OutDir dist -Rcedit "$env:RUNNER_TEMP/rcedit.exe"
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag (Get-ChildItem dist/*.zip).FullName --clobber }
          else { gh release create $tag (Get-ChildItem dist/*.zip).FullName --title "NEXORA Studio $($tag.TrimStart('v'))" --notes-file RELEASE_NOTES.md --latest }
