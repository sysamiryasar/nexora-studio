# Every push and pull request: run the full self-test inside the real app on Windows, macOS and Linux.
# A tag such as v2.1.0: also build the four download zips and publish them as that GitHub release
# (release notes come from RELEASE_NOTES.md). The website (Cloudflare Pages) deploys from main by itself.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Self-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Windows is the main platform and must pass; macOS and Linux results are reported without blocking a release
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Changelog files match nexora/app/changelog.js and package.json
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/changelog.ps1 -Check
      - name: Fetch FFmpeg (Windows) and the on-device AI models
        shell: pwsh
        run: ./scripts/fetch-vendor.ps1
      - name: System FFmpeg (macOS / Linux builds use an installed FFmpeg)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; else sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          ffmpeg -version | head -n 1
      - name: Self-test (Linux, virtual display)
        if: runner.os == 'Linux'
        # screen capture needs a real desktop session, which a virtual display does not provide
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" npx --yes electron@33.2.0 . --no-sandbox --nx-selftest --nx-userdata="$RUNNER_TEMP/nexora" "--nx-skip=gaming: real window capture"
      - name: Self-test
        if: runner.os != 'Linux'
        shell: bash
        run: |
          npx --yes electron@33.2.0 . --nx-selftest --nx-userdata="$RUNNER_TEMP/nexora"

  release:
    name: Build and publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch FFmpeg and the AI models
        shell: pwsh
        run: ./scripts/fetch-vendor.ps1
      - name: Online sign-in endpoint (repository secret GAS_URL, optional)
        shell: pwsh
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: |
          if ($env:GAS_URL) { @{ url = $env:GAS_URL } | ConvertTo-Json | Set-Content electron/gas.config.json -Encoding utf8NoBOM; 'online sign-in included' } else { 'no GAS_URL secret: local accounts only' }
      - name: Version must match the tag
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version; if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "package.json says $v but the tag is $env:GITHUB_REF_NAME" }
      - name: rcedit (puts the NEXORA icon and name into the Windows .exe)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -OutFile "$env:RUNNER_TEMP/rcedit.exe"
          "rcedit sha256: " + (Get-FileHash "$env:RUNNER_TEMP/rcedit.exe" -Algorithm SHA256).Hash
      - name: Package (portable zips)
        shell: pwsh
        run: ./scripts/package.ps1 -OutDir dist -Rcedit "$env:RUNNER_TEMP/rcedit.exe"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Windows installer (NSIS)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # built from the tested portable app (same files, same icon), so the installer can't miss anything
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $pre = Join-Path $env:RUNNER_TEMP 'prepackaged'; [IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path dist/NEXORA-Studio-win-x64.zip), $pre)
          npm install --no-audit --no-fund --no-save electron@33.2.0 electron-builder@25.1.8
          npx electron-builder --win nsis --x64 --publish never --prepackaged "$pre/NEXORA-Studio-win-x64"
          Copy-Item release/NEXORA-Studio-Setup-win-x64.exe dist/
          "installer: {0:N1} MB" -f ((Get-Item dist/NEXORA-Studio-Setup-win-x64.exe).Length / 1MB)
      - name: Upgrade test (previous release, then this installer over it, as the in-app updater does)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prev = Join-Path $env:RUNNER_TEMP 'prev'; New-Item -ItemType Directory -Force $prev | Out-Null
          gh release download --repo $env:GITHUB_REPOSITORY --pattern NEXORA-Studio-Setup-win-x64.exe --dir $prev 2>$null
          $old = Join-Path $prev 'NEXORA-Studio-Setup-win-x64.exe'
          if (-not (Test-Path $old)) { 'no earlier installer published: upgrade test skipped'; exit 0 }
          Start-Process $old -ArgumentList '/S' -Wait
          # the NSIS installer hands off to a second process, so wait for the files rather than trusting -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs/NEXORA Studio/NEXORA Studio.exe'
          # hosted runners are sometimes slow to unpack; give it five minutes
          for ($i = 0; $i -lt 300 -and -not (Test-Path $exe); $i++) { Start-Sleep 1 }; if (-not (Test-Path $exe)) { Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -ErrorAction SilentlyContinue | ForEach-Object Name; throw 'the previous release did not install' }
          $before = (Get-Item $exe).VersionInfo.ProductVersion; "installed first: $before"
          # exactly what the app runs when you press Update now
          Start-Process dist/NEXORA-Studio-Setup-win-x64.exe -ArgumentList '/S', '--force-run' -Wait
          $want = (Get-Content package.json -Raw | ConvertFrom-Json).version; $after = ''
          for ($i = 0; $i -lt 180; $i++) { if (Test-Path $exe) { $after = (Get-Item $exe).VersionInfo.ProductVersion; if ($after.StartsWith($want)) { break } }; Start-Sleep 1 }
          "after the update: $after (expected $want)"
          if (-not $after.StartsWith($want)) { throw "the update did not replace the old version ($after)" }
          $p = $null; for ($i = 0; $i -lt 20 -and -not $p; $i++) { Start-Sleep 1; $p = Get-Process 'NEXORA Studio' -ErrorAction SilentlyContinue }
          if (-not $p) { throw 'NEXORA did not reopen after the update' }; "reopened: $($p.Count) process(es)"; $p | Stop-Process -Force
          $apps = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object DisplayName -like 'NEXORA Studio*'
          "uninstall entries: $(@($apps).Count) ($((@($apps) | ForEach-Object DisplayVersion) -join ', '))"; if (@($apps).Count -ne 1) { throw 'expected exactly one installed NEXORA after the update' }
      - name: Install it silently and run the full self-test inside the installed app
        shell: pwsh
        run: |
          Start-Process dist/NEXORA-Studio-Setup-win-x64.exe -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs/NEXORA Studio/NEXORA Studio.exe'; for ($i = 0; $i -lt 120 -and -not (Test-Path $exe); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $exe)) { throw "installed app not found at $exe" }
          $vi = (Get-Item $exe).VersionInfo; "installed: $($vi.ProductName) $($vi.ProductVersion)"
          $start = Join-Path ([Environment]::GetFolderPath('Programs')) 'NEXORA Studio.lnk'; "start menu shortcut: $(Test-Path $start)"
          $p = Start-Process $exe -ArgumentList '--nx-selftest', "--nx-userdata=$env:RUNNER_TEMP/nx-installed" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/installed.out"
          if (-not $p.WaitForExit(1800000)) { throw 'self-test timed out' }
          $out = Get-Content "$env:RUNNER_TEMP/installed.out"; $out | Select-String 'NEXORA-SELFTEST|FAIL' | ForEach-Object Line
          if (-not ($out -match 'NEXORA-SELFTEST (\d+)/\1 passed')) { throw 'self-test of the installed app failed' }
      - name: Checksums (the in-app updater refuses an installer that does not match)
        shell: pwsh
        run: |
          (Get-ChildItem dist/*.zip, dist/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }) -join "`n" | Set-Content dist/SHA256SUMS.txt -NoNewline -Encoding utf8NoBOM
          Get-Content dist/SHA256SUMS.txt
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          $files = (Get-ChildItem dist/*.zip, dist/*.exe, dist/SHA256SUMS.txt).FullName
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $files --clobber }
          else { gh release create $tag $files --title "NEXORA Studio $($tag.TrimStart('v'))" --notes-file RELEASE_NOTES.md --latest }
