<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>NEXORA Studio</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10213a"/>
      <stop offset=".55" stop-color="#060a12"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".46" r=".55">
      <stop offset="0" stop-color="#5cb8ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#5cb8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f1ff"/>
      <stop offset=".45" stop-color="#5cb8ff"/>
      <stop offset="1" stop-color="#2f8be0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd8e3"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#halo)"/>
  <rect x="67" y="67" width="890" height="890" rx="197" fill="none" stroke="#5cb8ff" stroke-opacity=".35" stroke-width="6"/>
  <!-- N: two frame bars with angled cuts -->
  <path d="M292 760V318l104-58v500z" fill="url(#bar)"/>
  <path d="M732 264v442l-104 58V264z" fill="url(#bar)"/>
  <!-- the blade: the diagonal of the N, a light-blue cut through the frames -->
  <path d="M292 248h118l322 528H614z" fill="url(#blade)" filter="url(#glow)"/>
  <path d="M410 248l322 528" stroke="#ffffff" stroke-opacity=".85" stroke-width="7" stroke-linecap="round"/>
</svg>
